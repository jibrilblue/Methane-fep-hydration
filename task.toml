schema_version = "1.4"

artifacts = ["/app/output/fep.json", "/app/output/mbar_input.npz"]

[task]
name = "afterquery/methane-fep-hydration"
description = "Calculate the free energy of hydration of methane with OpenMM, openmmtools alchemical decoupling and MBAR."
authors = [{ name = "Jibril Suleiman Lere", email = "jibrilesslere@gmail.com" }]
keywords = ["MD", "Free Energy", "FEP", "OpenMM", "MBAR"]

[metadata]
author_name = "Jibril Suleiman Lere"
author_email = "jibrilesslere@gmail.com"
author_organization = "Independent Researcher"
author_profile = "https://orcid.org/0009-0007-1405-2206"
research_advisor = ""
referred_by = ""
conflicts_of_interest = "None"
domain = "physical-sciences"
field = "chemistry"
subfield = "computational chemistry"
category = "Science"
subcategory = "Chemistry"
tags = ["MD", "Free Energy", "FEP", "OpenMM", "MBAR"]
expert_time_estimate_hours = 6.0
relevant_experience = "Extensive experience in computational chemistry, molecular dynamics, and alchemical free energy calculations using OpenMM."
difficulty_explanation = "Alchemical decoupling has to be set up correctly: soft-core sterics, a lambda schedule that keeps neighbouring states overlapping (electrostatics off before sterics), reduced potentials evaluated at every state for every sample, decorrelation, and MBAR with the right sign convention. The run is a multi-hour CPU job, so the agent must also budget time and handle failures."
solution_explanation = "Solvate methane (GAFF-type parameters supplied in /app/inputs) in TIP3P with Amber14, build the alchemical system with openmmtools, run 12 lambda states (electrostatics off first, then sterics) for 500,000 steps each at 298.15 K / 1 atm with seed 42, evaluate reduced potentials at all states, subsample by statistical inefficiency, and run MBAR to get the hydration free energy, uncertainty and overlap matrix."
verification_explanation = "The verifier checks the output schema and declared protocol, and checks the lambda schedule. It re-runs MBAR on the submitted reduced-potential matrix and requires the reported free energy, uncertainty and overlap matrix to match the recomputation. It checks the overlap matrix and a plausible uncertainty range. Finally it compares the free energy to the reference within the tolerance."

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

[agent]
timeout_sec = 28800.0

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
network_mode = "no-network"
